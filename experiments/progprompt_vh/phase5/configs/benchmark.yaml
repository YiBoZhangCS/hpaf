benchmark:
  test_set: test_unseen
  scene: 0
  seed: 0
  methods:
    - ProgPrompt-GraphCompatible
    - HPAF-Flat
    - HPAF-Hierarchical
  smoke_tasks:
    - brush teeth
    - wash the plate

virtualhome:
  executable: third_party/virtualhome/unity/linux_exec.v2.3.0.x86_64
  port: 8091
  no_graphics: true
  render_unity_actions: false
  backend: unity_initialization_plus_evolving_graph_action_execution
  cached_initial_graph: experiments/progprompt_vh/results/environment_initial_state.json

progprompt:
  prompt_num_examples: 3
  prompt_examples:
    - put_the_wine_glass_in_the_kitchen_cabinet
    - throw_away_the_lime
    - wash_mug
  max_tokens: 600
  temperature: 0.0
  frequency_penalty: 0.15
  stop:
    - def

llm:
  active_provider: ark
  ark:
    provider: ark
    api_key_env: ARK_API_KEY
    model_env: ARK_MODEL
    default_model: doubao-seed-2-1-pro-260628
    base_url: https://ark.cn-beijing.volces.com/api/v3
    timeout_s: 180
    wall_clock_timeout_s: 240
    extra_body:
      thinking:
        type: disabled
  temperature: 0.0
  max_tokens: 600
  state_check_max_tokens: 600
  seed: null

frozen_artifacts:
  action_set: experiments/progprompt_vh/phase5/data/graph_supported_actions.json
  semantic_goals: experiments/progprompt_vh/phase5/data/semantic_goals_test_unseen.json
  decompositions: experiments/progprompt_vh/phase5/data/frozen_decompositions.json
